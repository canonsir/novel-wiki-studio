core:
  logline: "一个被羞辱和欲望驱动的大学生闯入地下秩序，在权力不断放大其欲望时，必须决定自己要成为支配他人的王，还是能够守住关系与底线的人。"
  dramatic_question: "陈浩南能否在权力、复仇和亲密关系的诱惑中建立自己的边界，而不是成为曾经憎恨的人？"
  theme_question: "一个人获得力量后，荣耀来自征服、占有，还是承担责任？"
  reader_promise: "主角在受压后持续夺回主动权；艳遇关系扩展、公开打脸、智谋反杀、兄弟追随、势力跃迁和后台揭示高频兑现，并以更大的敌人与欲望继续抬高期待。"
boundaries:
  must_keep:
    - "普通青年被卷入强势秩序后的身份跃迁"
    - "力量与欲望反噬人格的核心矛盾"
    - "亲密关系要求主角作出真实选择"
    - "主角不断叠加的艳遇，每段关系提供不同情绪与剧情价值"
    - "从校园到地方、跨城、家族和特殊组织的势力等级升级"
    - "父辈、导师、家族与神秘强者构成的后台人物揭示"
    - "原稿核心高潮链：匿名约见、宾馆破门、绝境反击、诱捕报复、强制染毒创伤、拘留结识海哥、海迪救场与主动入局"
    - "成人向暧昧、欲望、嫉妒、关系竞争和权力交换的戏剧张力"
  must_avoid:
    - "将强迫、偷拍、羞辱和师生权力差浪漫化"
    - "以女性角色作为奖品或性功能标签"
    - "艳遇只重复身体描写，不改变关系、资源、风险或主线"
    - "势力升级只换更强敌人，不改变规则、地图和代价"
    - "后台人物无铺垫、无边界地替主角清除全部终局矛盾"
    - "可复制的犯罪、毒品或暴力操作细节"
  adaptation_policy:
    - "敏感内容优先做非露骨化、后果化和边界明确化处理，不因敏感而删除其剧情功能"
    - "无法合规保留的桥段必须替换为等强度冲突，不得降格为概述或日常过场"
    - "主角可以有错误欲望和越界冲动，但叙事必须保留反思、阻力与真实代价"
    - "小说正文、AI短剧正片和红果投放素材分层改编，共享事件因果但采用不同镜头尺度"
    - "红果AI素材不得以色情、毒品、赌博、血腥或未成年人风险作为吸睛点"
    - "不以刻意擦边规避审核；使用高张力非露骨表达保留成年欲望、暧昧和关系争夺"
    - "平台红线压缩的刺激量必须由身份错位、地位逆转、公开打脸、资源升级和后台揭示补足"
    - "爽点先完整兑现，代价允许延迟显影，不在高潮当场用说教抵消情绪回报"
  ending_constraints:
    - "终局必须由主角此前的选择和代价推动"
    - "核心感情线与主角最终命运需用户确认"
