schema_version: 1
id: my-glory
title: "我的荣耀"
status: setup
language: zh-CN
genre: [都市, 逆袭, 爽文, 后宫, 热血]
target_audience: "男频都市 18-35"
target_platforms: [番茄小说, 红果短剧]
content_rating: "待确认（番茄发布版 / 红果漫剧版 / 红果无尺度素材版 三层）"
planned_length_words: 3000000  # 原稿 747 章/250 万字；DEC-006 授权重构扩至 300-350 万字
planned_volumes: 6             # 蓉城三部曲 + 帝都门阀 + 神龙线 + 终局（S1-S6）；章节区间非硬约束（DEC-006）
creative_goal:
  outcome: original_novel
  approach: "原创重构"
  source_rights: "用户自有或已获合法授权（待最终确认）"
narrative:
  pov: "第一人称男主（顾北辰 POV），后期可穿插女主/反派 POV"
  tense: "过去时为主"
  tone: [爽文, 街头感, 兄弟义气, 真实文脉, 画面感收敛, 后宫张力, 逆袭打脸, 打怪升级]
  pacing: "章末钩子驱动；平均 3000-5000 字/章；每章 ≥ 3 爽点锚点（见 wiki/world/爽点节奏保障方案.md）"
core:
  logline: "蓉城三流大专的网吧少年顾北辰（北哥）在一次匿名约见中卷入门阀继承人的仙人跳，被迫以街头狠劲反杀，一路从夜场打到帝都五家议会，最终在'众星拱北辰'的格局中完成命盘杀破狼聚齐的身世闭环。"
  dramatic_question: "一个被豪门逐出的支系少年，能否在不丢掉底层血性的前提下走到北辰之位？"
  theme_question: "荣耀是外界授予的位置，还是自己配得起的名字？"
  reader_promise: "都市逆袭 + 打怪升级 + 后宫爽文；每章可见身份错位 / 地位逆转 / 公开打脸 / 资源升级 / 后台揭示；敏感内容统一采用'画面感 + 点到即可'收敛（见 DEC-20261010-005 与 wiki/world/爽点节奏保障方案.md）"
  creative_pivot:
    status: accepted
    source: decisions/DEC-20261010-005-creative-pivot-rush-harem.md
    four_axes:
      - 逆袭轴：每 5 章 ≥ 1 次公开打脸，6 种类型轮换
      - 升级轴：境界 / 积分 / 门第 / 装备 / 技法 / 后台 六维可见
      - 爽文轴：每章 ≥ 3 爽点锚点 + 章末钩子
      - 后宫轴：6 位核心女主独立情感线 + 独占回报
    sensitive_reduction_mode: "画面感代偿（非一刀切删除）"
boundaries:
  must_keep:
    - 原稿全部主线事件、人物关系、爽感节点、后宫张力
    - "北辰 + 杀破狼"命理主轴
    - 真实文脉背景（淮军/湘军/漕运/内务府皇商/北洋军统 五大家族）
    - 组织原名（天下会 / 鬼组 / 海迪 / 狼舞 / 白袍会 / 忠信帮 / 飞鸿帮 / 天一集团 / 神龙基地 / 青龙帮）
    - 真实武学术语（道家十二段锦 / 杀破狼 / 十重天宫 / 一级药剂）
    - 大结局保留"我的荣耀"的身份闭环
  must_avoid:
    - 任何真实在世人物的影射或丑化
    - 可直接复刻的制毒 / 制爆 / 武器改装 / 骗保等违法操作细节
    - 对真实地名的直接使用（成都→蓉城，北京→帝都；见 real-to-fictional-map.md）
    - 原稿的女性物化、种族 / 地域歧视表达
    - 未成年人涉性 / 涉犯罪情节
  ending_constraints:
    - 顾北辰在五家议会中达成"众星拱北辰"
    - 杀破狼三星（破军=军师 / 贪狼 / 七杀）命盘闭环（S4 末完成）
    - 不写悲剧收尾；核心兄弟不全员死亡
    - 所有 S1-S4 伏笔必须在 S5-S6 收束（DEC-006）
    - 核心主题"荣耀"必须在终章给出明确答题（DEC-006）
    - 核心 6 位女主各有明确归宿点，不工具化（DEC-006）
  ending_reconstruction:
    status: user_ack_pending
    source: decisions/DEC-20261010-006-ending-reconstruction-authorized.md
    brief: wiki/plot/S5-S6结尾重构·方向简报.md
    options: [方向A·传统爽文, 方向B·真实文脉, 方向C·双层结局（推荐）]
shared_universe: null
source_of_truth:
  raw_immutable: true
  wiki_owner: llm
  human_approval_required:
    - core_theme
    - protagonist_fate
    - ending
    - publication_risk
    - naming_system          # 顾北辰方案（本次新增，由 DEC-20261010-001 承载）
    - family_lineage         # 五大家族文脉（本次新增）
graph:
  required: true
  engine: flowgram
  output: graph/story-graph.json
